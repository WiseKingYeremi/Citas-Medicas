<h2 mat-dialog-title class="py-5! text-center font-bold!">{{titulo}}</h2>
<mat-divider class="border-2"></mat-divider>
<mat-dialog-content>
    <form id="frmMedico" [formRoot]="frmMedico" class="grid gap-4 py-2">
        <mat-form-field appearence="outline">
            <mat-label>Especialidad</mat-label>
            <input matInput type="number" placeholder="ID Especialidad" [formField]="frmMedico.especialidad_id">
        </mat-form-field>

        <mat-form-field appearence="outline">
            <mat-label>Nombre Completo</mat-label>
            <input matInput type="text" placeholder="Nombre Completo" [formField]="frmMedico.nombre_completo">
        </mat-form-field>

        <mat-form-field appearence="outline">
            <mat-label>Licencia</mat-label>
            <input matInput type="text" placeholder="Licencia" [formField]="frmMedico.licencia">
        </mat-form-field>

        <mat-form-field appearence="outline">
            <mat-label>Telefono</mat-label>
            <input matInput type="text" placeholder="Télefono" [formField]="frmMedico.telefono!">
        </mat-form-field>

        <mat-form-field appearence="outline">
            <mat-label>Usuario</mat-label>
            <input matInput type="text" placeholder="Nombre de usuario" [formField]="frmMedico.username!">
        </mat-form-field>

        <mat-form-field appearence="outline">
            <mat-label>Contraseña</mat-label>
            <input matInput type="text" placeholder="Contraseña" [formField]="frmMedico.password!">
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-divider class="border-2"></mat-divider>
<mat-dialog-actions>
    <button mat-button type="button" [mat-dialog-close]="false">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" form="frmMedico" [disabled]="frmMedico().invalid()">Guardar</button>
</mat-dialog-actions>
