services:

  db:
    image: mysql:9.7
    container_name: base_datos
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: citas_medicas
    ports:
      - 3307:3306
    volumes:
      - ./db_dump:/docker-entrypoint-initdb.d
      - ./mysql:/var/lib/mysql
    secrets:
      - db_password

  webdatos:
    container_name: web_datos
    volumes:
      - ./Data/public:/var/www/html/public
    build:
      context: .
      dockerfile: ./Data/Dockerfile
    ports:
      - 8080:80

secrets:
  db_password:
    file: ./db_password.txt